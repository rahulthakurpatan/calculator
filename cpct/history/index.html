<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,follow"><meta name="robots" content="noindex,follow"><meta name="description" content="Review CPCT typing practice attempts saved in this browser, including estimated speed, accuracy and errors."><link rel="canonical" href="https://returnoninvestmentcalculator.in/cpct/history/"><title>CPCT Typing Practice History</title><link rel="stylesheet" href="/assets/cpct/cpct.css"><script src="/assets/js/common-branding.js" defer></script><script src="/assets/js/common-header.js" defer></script><script src="/assets/js/common-footer.js" defer></script></head><body><div id="site-header"></div><main class="cpct-wrap" style="padding:35px 0"><section class="cpct-hero"><span class="cpct-eyebrow">Saved on this device</span><h1>CPCT Practice History</h1><p class="cpct-lead">Your latest typing attempts saved in this browser.</p></section><section class="cpct-panel"><div class="cpct-actions"><a class="cpct-btn" href="/cpct/">Back to CPCT practice</a><button class="cpct-btn alt" id="clear" type="button">Clear history</button></div><div id="history" style="overflow:auto;margin-top:18px"></div><p class="cpct-small">Speed figures are approximate practice estimates, not official CPCT scores. History is local to this browser and is not synced.</p></section></main><div id="site-footer"></div><script>
(()=>{const box=document.getElementById('history');function draw(){let rows=[];try{rows=JSON.parse(localStorage.getItem('cpctPracticeHistory')||'[]');if(!Array.isArray(rows))rows=[];}catch(e){rows=[];}if(!rows.length){box.innerHTML='<p class="cpct-muted">No saved attempts yet. Complete a typing practice test first.</p>';return;}box.innerHTML='<table class="cpct-table"><thead><tr><th>Date</th><th>Language</th><th>Layout</th><th>Duration</th><th>Net WPM*</th><th>Accuracy</th><th>Errors</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+new Date(r.date).toLocaleString()+'</td><td>'+(r.language==='en'?'English':'Hindi')+'</td><td>'+String(r.layout)+'</td><td>'+r.duration+' min</td><td>'+Number(r.net).toFixed(1)+'</td><td>'+Number(r.accuracy).toFixed(1)+'%</td><td>'+r.errors+'</td></tr>').join('')+'</tbody></table>';}document.getElementById('clear').addEventListener('click',()=>{if(confirm('Clear all saved CPCT practice history from this browser?')){localStorage.removeItem('cpctPracticeHistory');draw();}});draw();})();
</script></body></html>
