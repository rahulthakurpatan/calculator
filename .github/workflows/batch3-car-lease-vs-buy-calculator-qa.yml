name: Batch3 car-lease-vs-buy-calculator QA
on:
  pull_request:
    paths:
      - 'car-lease-vs-buy-calculator/**'
      - 'tests/batch3-car-lease-vs-buy-calculator.cjs'
      - 'sitemap.xml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/batch3-car-lease-vs-buy-calculator.cjs
