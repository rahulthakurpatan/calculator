name: Batch3 xirr-calculator Mobile Browser QA
on:
  pull_request:
    paths:
      - 'xirr-calculator/**'
      - '.github/workflows/batch3-xirr-calculator-browser.yml'
  push:
    branches:
      - 'feature/batch3-xirr-20261115'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright
      - run: python -m playwright install --with-deps chromium
      - name: Verify calculator on desktop and mobile
        env:
          CALC_SLUG: xirr-calculator
        run: |
          python - <<'PY'
          import os, threading
          from functools import partial
          from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer
          from playwright.sync_api import sync_playwright
          class Quiet(SimpleHTTPRequestHandler):
              def log_message(self,*args):pass
          server=ThreadingHTTPServer(('127.0.0.1',0),partial(Quiet,directory='.'))
          threading.Thread(target=server.serve_forever,daemon=True).start()
          try:
              with sync_playwright() as p:
                  browser=p.chromium.launch(headless=True)
                  for width,height in [(1440,900),(375,812)]:
                      page=browser.new_page(viewport={'width':width,'height':height})
                      errors=[]
                      page.on('pageerror',lambda e: errors.append(str(e)))
                      page.goto(f'http://127.0.0.1:{server.server_port}/'+os.environ['CALC_SLUG']+'/',wait_until='domcontentloaded')
                      page.locator('h1').wait_for()
                      page.locator('#result').wait_for()
                      assert not errors,errors
                      assert page.locator('#result').inner_text().strip(), 'Empty calculator output'
                      assert page.evaluate('document.documentElement.scrollWidth <= window.innerWidth+2'), 'Horizontal overflow'
                      page.screenshot(path=f'/tmp/{os.environ["CALC_SLUG"]}-{width}.png',full_page=True)
                      page.close()
                  browser.close()
          finally:server.shutdown()
          PY
