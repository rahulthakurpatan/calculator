name: Homepage Calculator Cloud QA
on:
  push:
    paths:
      - 'index.html'
      - 'assets/js/calculator-cloud.js'
      - '.github/workflows/calculator-cloud-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate homepage-only cloud and dynamic sitemap links
        run: |
          node <<'NODE'
          const fs=require('node:fs'),vm=require('node:vm'),assert=require('node:assert/strict');
          const js=fs.readFileSync('assets/js/calculator-cloud.js','utf8');
          const home=fs.readFileSync('index.html','utf8');
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          new vm.Script(js,{filename:'calculator-cloud.js'});
          assert.equal((home.match(/src="\/assets\/js\/calculator-cloud\.js"/g)||[]).length,1);
          assert.equal((home.match(/adsbygoogle\.js/g)||[]).length,1);
          assert.ok(!fs.readFileSync('sip-calculator/index.html','utf8').includes('calculator-cloud.js'),'Cloud only on homepage');
          assert.ok(js.includes('min-width:1440px') && js.includes('prefers-reduced-motion:reduce'));
          assert.ok(js.includes('linear-gradient('),'Subtle AI text gradient exists');
          const locs=[...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(x=>x[1]);
          assert.ok(locs.length>50,'Production sitemap has calculator URLs');
          function makeEnv(pathname){
            let interval=null;
            const timeouts=[], appended=[], listeners={};
            function element(tag){
              const self={
                tag,style:{},attributes:{},children:[],events:{},textContent:'',className:'',href:'',title:'',isConnected:true,
                classList:{add(){},remove(){}},
                setAttribute(k,v){this.attributes[k]=v;},
                getAttribute(k){return k==='href'?this.href:this.attributes[k];},
                addEventListener(k,cb){(this.events[k]??=[]).push(cb);},
                appendChild(node){this.children.push(node);node.isConnected=true;},
                contains(node){return this.children.includes(node);},
                matches(){return false;},
                getBoundingClientRect(){return {left:1340,top:150,width:210,height:500};}
              };return self;
            }
            const doc={
              readyState:'complete',visibilityState:'visible',activeElement:null,
              getElementById(){return null;},createElement:element,querySelectorAll(){return [];},
              head:{appendChild(node){appended.push(node);}},
              body:{appendChild(node){appended.push(node);}},
              addEventListener(name,fn){(listeners[name]??=[]).push(fn);}
            };
            const env={location:{pathname,origin:'https://returnoninvestmentcalculator.in'},URL,Math,Number,Array,Object,String,Set,Map,console,document:doc,
              window:{setInterval(cb){interval=cb;return 1;}},setTimeout(cb){timeouts.push(cb);},
              matchMedia(query){return {matches:!query.includes('reduced-motion'),addEventListener(){}};},
              performance:{now(){return 1000;}},requestAnimationFrame(){return 1;},cancelAnimationFrame(){},
              fetch:async()=>({ok:true,text:async()=>sitemap}),
              DOMParser:class{parseFromString(){return {getElementsByTagName(t){if(t==='parsererror')return [];if(t==='loc')return locs.map(textContent=>({textContent}));return [];}};}}
            };
            return {env,appended,timeouts,getInterval:()=>interval};
          }
          (async()=>{
            const onHome=makeEnv('/');
            vm.runInNewContext(js,onHome.env,{timeout:1000});
            await new Promise(resolve=>setImmediate(resolve));
            const cloud=onHome.appended.find(x=>x.tag==='nav');
            assert.ok(cloud && cloud.attributes['aria-label'],'Accessible nav present on homepage');
            assert.equal(cloud.children.length,15,'Fifteen floating name links displayed');
            assert.equal(new Set(cloud.children.map(a=>a.href)).size,15,'No repeated visible calculators');
            assert.ok(cloud.children.every(a=>a.tag==='a'&&a.href.startsWith('/')&&a.textContent.length>0),'Real clickable text links');
            assert.equal(cloud.children.filter(x=>x.tag!=='a').length,0,'No cards or icons');
            const before=cloud.children.map(a=>a.href);
            const rotate=onHome.getInterval();
            assert.equal(typeof rotate,'function');
            rotate();
            onHome.timeouts.forEach(fn=>fn());
            assert.ok(cloud.children.some((a,i)=>a.href!==before[i]),'Sitemap-powered rotation replaces one tool');
            const offHome=makeEnv('/sip-calculator/');
            vm.runInNewContext(js,offHome.env,{timeout:1000});
            await new Promise(resolve=>setImmediate(resolve));
            assert.equal(offHome.appended.length,0,'Calculator pages remain untouched');
            console.log('PASS: JS syntax, homepage-only load, sitemap discovery, 15 text links, no icons/cards, rotation, semantic links, motion accessibility, and AdSense count');
          })().catch(err=>{console.error(err);process.exitCode=1;});
          NODE
