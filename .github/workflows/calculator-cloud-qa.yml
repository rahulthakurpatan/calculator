name: Shared Calculator Cloud QA
on:
  push:
    paths:
      - 'index.html'
      - 'assets/js/common-header.js'
      - 'assets/js/calculator-cloud.js'
      - '.github/workflows/calculator-cloud-qa.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit shared cloud loader across all site HTML pages
        run: |
          node <<'NODE'
          const fs=require('node:fs'),path=require('node:path');
          const pages=[];
          function walk(dir){
            for(const f of fs.readdirSync(dir,{withFileTypes:true})){
              if(['.git','node_modules'].includes(f.name))continue;
              const file=path.join(dir,f.name);
              if(f.isDirectory())walk(file);
              else if(file.endsWith('.html'))pages.push(file);
            }
          }
          walk('.');
          const missing=pages.filter(file=>!fs.readFileSync(file,'utf8').includes('/assets/js/common-header.js'));
          console.log('HTML_PAGES='+pages.length);
          console.log('MISSING_SHARED_HEADER='+JSON.stringify(missing));
          NODE
      - name: Test dual sidebars, related links and global loading
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict'),fs=require('node:fs'),vm=require('node:vm');
          const js=fs.readFileSync('assets/js/calculator-cloud.js','utf8');
          const header=fs.readFileSync('assets/js/common-header.js','utf8');
          const home=fs.readFileSync('index.html','utf8');
          const sitemap=fs.readFileSync('sitemap.xml','utf8');
          new vm.Script(js);
          new vm.Script(header);
          assert.equal((header.match(/cloudScript\.src = '\/assets\/js\/calculator-cloud\.js'/g)||[]).length,1);
          assert.equal((home.match(/src="\/assets\/js\/calculator-cloud\.js"/g)||[]).length,0,'No duplicate direct homepage loading');
          assert.equal((home.match(/adsbygoogle\.js/g)||[]).length,1);
          assert.ok(header.includes('window.__calculatorCloudCategories = categories.map'),'Shared navigation categories exposed');
          assert.ok(js.includes('prefers-reduced-motion:reduce')&&js.includes('min-width:1440px'));
          const locs=[...sitemap.matchAll(/<loc>([^<]+)<\/loc>/g)].map(m=>m[1]);
          assert.ok(locs.length>60);
          const cats=[
            {label:'Invest & Mutual Funds',tools:[['ROI Calculator','/'],['SIP Calculator','/sip-calculator/'],['Dividend Reinvestment Calculator','/dividend-reinvestment-calculator/'],['Compound Interest','/compound-interest-calculator/'],['SWP','/swp-calculator/'],['Step Up SIP','/step-up-sip-calculator/']]},
            {label:'Tax & Salary',tools:[['Income Tax','/income-tax-calculator/'],['Overtime Pay','/overtime-pay-calculator/'],['Digital Nomad Tax','/digital-nomad-tax-calculator/']]},
            {label:'Savings & Loans',tools:[['Mortgage Payoff','/mortgage-payoff-calculator/'],['Loan Amortization','/loan-amortization-calculator/']]}
          ];
          function env(pathname,validSitemap=true){
            const nodes=[],callbacks=[],handles=[],events={};
            function node(tag){
              return {tag,style:{},attributes:{},children:[],events:{},href:'',title:'',textContent:'',isConnected:true,dataset:{},
                classList:{add(){},remove(){}},
                setAttribute(k,v){this.attributes[k]=v;},
                getAttribute(k){return k==='href'?this.href:this.attributes[k];},
                addEventListener(k,cb){(this.events[k]??=[]).push(cb);},
                appendChild(n){this.children.push(n);n.isConnected=true;},
                contains(n){return this.children.includes(n);},
                getBoundingClientRect(){return {left:0,top:100,height:660,width:200};}
              };
            }
            const document={readyState:'complete',visibilityState:'visible',activeElement:null,
              getElementById(){return null;},createElement:node,querySelectorAll(){return [];},
              head:{appendChild(n){nodes.push(n);}},body:{appendChild(n){nodes.push(n);}},
              addEventListener(n,f){(events[n]??=[]).push(f);}
            };
            const context={document,window:{__calculatorCloudCategories:cats,setInterval(fn){handles.push(fn);return handles.length;},setTimeout(fn){callbacks.push(fn);}},location:{pathname,origin:'https://returnoninvestmentcalculator.in'},console,
              matchMedia(q){return{matches:!q.includes('reduced-motion'),addEventListener(){}};},
              fetch:async()=>({ok:validSitemap,text:async()=>sitemap}),URL,Math,Number,String,Set,Map,Array,Object,
              DOMParser:class{parseFromString(){return {getElementsByTagName(tag){return tag==='parsererror'?[]:tag==='loc'?locs.map(textContent=>({textContent})):[];}};}},
              performance:{now(){return 0;}},requestAnimationFrame(){return 1;},cancelAnimationFrame(){}};
            return{context,nodes,handles,callbacks};
          }
          (async()=>{
            for(const path of ['/', '/sip-calculator/', '/overtime-pay-calculator/', '/mortgage-payoff-calculator/']){
              const e=env(path);
              vm.runInNewContext(js,e.context,{timeout:2000});
              await new Promise(resolve=>setImmediate(resolve));
              const right=e.nodes.find(n=>n.attributes['aria-label']==='Explore calculators');
              const left=e.nodes.find(n=>n.attributes['aria-label']==='Related calculators');
              assert.ok(left && right, path+' dual sidebars exist');
              assert.equal(right.children.length,15,'Right cloud has 15 rotating names');
              assert.equal(left.children.length,12,'Left cloud has 12 related names');
              assert.ok([...left.children,...right.children].every(a=>a.tag==='a'&&a.href.startsWith('/')&&a.textContent),'All links are semantic text anchors');
              assert.equal(new Set(right.children.map(a=>a.href)).size,right.children.length);
              assert.ok(!left.children.some(a=>a.href===path),'No current-page self link');
              assert.ok(!right.children.some(a=>a.href===path),'No current-page self link in right cloud');
              if(path==='/sip-calculator/'){
                assert.ok(left.children.some(a=>a.href==='/compound-interest-calculator/'),'Investment category related');
              }
              if(path==='/overtime-pay-calculator/'){
                assert.ok(left.children.some(a=>a.href==='/income-tax-calculator/'),'Salary category related');
              }
              const before=right.children.map(a=>a.href);
              assert.equal(e.handles.length,1,'Single right-side rotation timer');
              e.handles[0]();e.callbacks.forEach(fn=>fn());
              assert.ok(right.children.some((a,i)=>a.href!==before[i]),'Right side rotates different calculators');
            }
            const e=env('/dividend-reinvestment-calculator/',false);
            vm.runInNewContext(js,e.context,{timeout:2000});
            await new Promise(resolve=>setImmediate(resolve));
            assert.ok(e.nodes.some(n=>n.attributes['aria-label']==='Related calculators'),'Shared categories work even if sitemap fetch fails');
            console.log('PASS shared script syntax, global header loader, homepage, SIP, salary, mortgage, DRIP, related links, self-link exclusions, 15/12 names, rotating links, sitemap fallback');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
