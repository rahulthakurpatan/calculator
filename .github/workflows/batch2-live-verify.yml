name: Batch 2 Live Production Verification
on:
  push:
    branches: [main]
    paths:
      - 'portfolio-rebalancing-calculator/**'
      - 'mortgage-points-break-even-calculator/**'
      - 'rental-property-roi-calculator/**'
      - '.github/workflows/batch2-live-verify.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify all three live calculator URLs and sitemap after Pages propagation
        run: |
          python - <<'PY'
          import urllib.request,time,sys
          base='https://returnoninvestmentcalculator.in'
          slugs=['portfolio-rebalancing-calculator','mortgage-points-break-even-calculator','rental-property-roi-calculator']
          def fetch(url):
              req=urllib.request.Request(url,headers={'User-Agent':'InvestCalc-Batch2-LiveQA/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=20) as response:
                  if response.status!=200: raise RuntimeError('HTTP '+str(response.status))
                  return response.read(350000).decode('utf-8','replace')
          pending=set(slugs)
          for attempt in range(12):
              try: sitemap=fetch(base+'/sitemap.xml')
              except Exception as exc: print('Sitemap pending:',exc);sitemap=''
              for slug in list(pending):
                  url=base+'/'+slug+'/'
                  try:
                      body=fetch(url)
                      assert '<h1' in body and 'adsbygoogle.js' in body and body.count('adsbygoogle.js')==1
                      assert 'rel="canonical" href="'+url+'"' in body
                      assert url in sitemap
                      assert 'common-header.js' in body and 'common-footer.js' in body
                      pending.remove(slug);print('LIVE VERIFIED:',url)
                  except Exception as exc: print('Pending:',slug,str(exc))
              if not pending: break
              time.sleep(20)
          if pending:
              print('NOT LIVE VERIFIED:',', '.join(sorted(pending)))
              sys.exit(1)
          print('All three calculator pages and sitemap verified on production.')
          PY
