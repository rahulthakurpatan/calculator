name: Batch 2 rental Browser QA
on:
  push:
    branches: [batch2-rental-after-mortgage-20261115]
  pull_request:
    paths: ['rental-property-roi-calculator/**','tests/test_batch2_rental.py','sitemap.xml','assets/js/common-search.js','assets/js/common-header.js','assets/js/common-footer.js']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - run: python -m unittest discover -s tests -p test_batch2_rental.py -v
