name: Batch3 xirr-calculator QA
on:
  pull_request:
    paths:
      - 'xirr-calculator/**'
      - 'tests/batch3-xirr-calculator.cjs'
      - 'sitemap.xml'
  push:
    branches:
      - 'feature/batch3-xirr-20261115'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/batch3-xirr-calculator.cjs
