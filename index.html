<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="A clean, responsive calculator demo page.">
  <title>Calculator — Sample Page</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0b1220;
      color: #edf2f7;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 16px;
      background: radial-gradient(ellipse at 50% 0%, #1b2a43 0%, #0b1220 58%);
    }
    .shell { width: min(100%, 390px); }
    .eyebrow {
      margin: 0 0 10px;
      color: #8fa4c2;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .18em;
      text-align: center;
      text-transform: uppercase;
    }
    h1 { margin: 0 0 22px; font-size: 25px; font-weight: 650; text-align: center; }
    .calculator {
      padding: 18px;
      border: 1px solid #2b3a50;
      border-radius: 25px;
      background: rgba(17, 27, 43, .94);
      box-shadow: 0 24px 70px rgba(0, 0, 0, .38);
    }
    .display {
      min-height: 118px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      gap: 9px;
      overflow: hidden;
      padding: 15px 8px 22px;
    }
    .previous { min-height: 20px; color: #8fa4c2; font-size: 14px; }
    .current {
      width: 100%;
      overflow: hidden;
      color: #f8fafc;
      font-size: clamp(34px, 10vw, 48px);
      font-weight: 550;
      letter-spacing: -.04em;
      text-align: right;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .keys { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    button {
      min-height: 66px;
      border: 1px solid transparent;
      border-radius: 17px;
      background: #243248;
      color: #edf2f7;
      cursor: pointer;
      font: inherit;
      font-size: 20px;
      font-weight: 600;
      transition: transform .12s ease, background .12s ease, border-color .12s ease;
      -webkit-tap-highlight-color: transparent;
    }
    button:hover { background: #30425d; }
    button:active { transform: scale(.96); }
    button:focus-visible { outline: 3px solid #7dd3fc; outline-offset: 2px; }
    .utility { background: #34445b; color: #c7d5e8; }
    .operator { background: #173c59; color: #8bd5ff; }
    .operator.active { border-color: #72caff; background: #20577c; }
    .equals { background: #1683b8; color: white; }
    .equals:hover { background: #2198cf; }
    .zero { grid-column: span 2; }
    .hint { margin: 16px 4px 0; color: #8193ad; font-size: 12px; line-height: 1.5; text-align: center; }
    footer { margin-top: 20px; color: #64748b; font-size: 11px; text-align: center; }
    @media (max-width: 360px) {
      .calculator { padding: 13px; }
      .keys { gap: 8px; }
      button { min-height: 59px; border-radius: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <p class="eyebrow">GitHub repository test</p>
    <h1>Simple Calculator</h1>
    <section class="calculator" aria-label="Calculator">
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="previous" id="previous"></div>
        <div class="current" id="display">0</div>
      </div>
      <div class="keys">
        <button class="utility" data-action="clear" aria-label="Clear all">AC</button>
        <button class="utility" data-action="sign" aria-label="Change sign">+/−</button>
        <button class="utility" data-action="percent" aria-label="Percent">%</button>
        <button class="operator" data-operator="÷" aria-label="Divide">÷</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="operator" data-operator="×" aria-label="Multiply">×</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="operator" data-operator="−" aria-label="Subtract">−</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="operator" data-operator="+" aria-label="Add">+</button>

        <button class="zero" data-number="0">0</button>
        <button data-action="decimal" aria-label="Decimal point">.</button>
        <button class="equals" data-action="equals" aria-label="Equals">=</button>
      </div>
    </section>
    <p class="hint">Use the buttons or your keyboard. Press Enter for equals and Backspace to delete.</p>
    <footer>Sample page · HTML, CSS and JavaScript · No external libraries</footer>
  </main>

  <script>
    (() => {
      const display = document.getElementById('display');
      const previous = document.getElementById('previous');
      const keys = document.querySelector('.keys');
      let current = '0';
      let stored = null;
      let operator = null;
      let waitingForOperand = false;
      let justCalculated = false;

      const render = () => {
        display.textContent = current;
        previous.textContent = stored !== null && operator ? `${stored} ${operator}` : '';
        keys.querySelectorAll('[data-operator]').forEach(button => {
          button.classList.toggle('active', button.dataset.operator === operator);
        });
      };

      const format = value => {
        if (!Number.isFinite(value)) return 'Error';
        const rounded = Number.parseFloat(value.toPrecision(12));
        return String(rounded);
      };

      const inputNumber = number => {
        if (current === 'Error' || waitingForOperand || justCalculated) {
          current = number;
          waitingForOperand = false;
          justCalculated = false;
        } else if (current === '0') {
          current = number;
        } else if (current.replace('-', '').length < 14) {
          current += number;
        }
        render();
      };

      const chooseOperator = nextOperator => {
        const value = Number(current);
        if (!Number.isFinite(value)) return;
        if (operator && !waitingForOperand) calculate();
        stored = Number(current);
        operator = nextOperator;
        waitingForOperand = true;
        justCalculated = false;
        render();
      };

      const calculate = () => {
        if (operator === null || stored === null) return;
        const a = stored;
        const b = Number(current);
        let result;
        switch (operator) {
          case '+': result = a + b; break;
          case '−': result = a - b; break;
          case '×': result = a * b; break;
          case '÷': result = b === 0 ? NaN : a / b; break;
          default: return;
        }
        previous.textContent = `${a} ${operator} ${b} =`;
        current = format(result);
        stored = null;
        operator = null;
        waitingForOperand = true;
        justCalculated = true;
        render();
      };

      const act = action => {
        switch (action) {
          case 'clear':
            current = '0'; stored = null; operator = null;
            waitingForOperand = false; justCalculated = false; break;
          case 'decimal':
            if (current === 'Error' || waitingForOperand || justCalculated) {
              current = '0.'; waitingForOperand = false; justCalculated = false;
            } else if (!current.includes('.')) current += '.';
            break;
          case 'sign':
            if (current !== '0' && current !== 'Error') current = current.startsWith('-') ? current.slice(1) : '-' + current;
            break;
          case 'percent':
            if (current !== 'Error') current = format(Number(current) / 100);
            break;
          case 'equals': calculate(); return;
          case 'backspace':
            if (current === 'Error' || waitingForOperand || justCalculated) {
              current = '0'; waitingForOperand = false; justCalculated = false;
            } else {
              current = current.length > 1 ? current.slice(0, -1) : '0';
              if (current === '-') current = '0';
            }
            break;
        }
        render();
      };

      keys.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        if (button.dataset.number !== undefined) inputNumber(button.dataset.number);
        else if (button.dataset.operator) chooseOperator(button.dataset.operator);
        else if (button.dataset.action) act(button.dataset.action);
      });

      document.addEventListener('keydown', event => {
        if (/^[0-9]$/.test(event.key)) inputNumber(event.key);
        else if (event.key === '.') act('decimal');
        else if (event.key === '+') chooseOperator('+');
        else if (event.key === '-') chooseOperator('−');
        else if (event.key === '*') chooseOperator('×');
        else if (event.key === '/') { event.preventDefault(); chooseOperator('÷'); }
        else if (event.key === 'Enter' || event.key === '=') { event.preventDefault(); act('equals'); }
        else if (event.key === 'Backspace') act('backspace');
        else if (event.key === 'Escape') act('clear');
        else if (event.key === '%') act('percent');
      });

      render();
    })();
  </script>
</body>
</html>
